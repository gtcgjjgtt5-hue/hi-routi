<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>축하 오버레이 미리보기</title>
<link rel="stylesheet" href="styles.css?v=3">
<style>
  body{background:#FAF8F2}
  .demo{position:relative;width:390px;height:640px;margin:0 auto;overflow:hidden;border-bottom:1px solid #ddd}
  .demo .pop{position:absolute;opacity:1}
  .demo .cf{animation-play-state:paused;animation-delay:-.14s}
  .hint{padding:10px;font-size:11px;color:#888;text-align:center}
</style>
</head>
<body>
  <div class="demo">
    <div class="pop show big">
      <div class="pop-inner">
        <div class="pop-seal"><span>쾅!</span></div>
        <p class="pop-text">루티 도장 쾅!</p>
        <p class="pop-sub">이번 주 1번째 도장 · 작은 거인</p>
      </div>
      <div class="confetti">
        <span class="cf" style="left:38%;background:#D9B678;--dx:-30px;--rot:180deg"></span>
        <span class="cf" style="left:45%;background:#E3B49E;--dx:-60px;--rot:320deg"></span>
        <span class="cf" style="left:52%;background:#AEB9A5;--dx:20px;--rot:120deg;border-radius:50%"></span>
        <span class="cf" style="left:58%;background:#B6C5CF;--dx:55px;--rot:260deg"></span>
        <span class="cf" style="left:64%;background:#E9CFA0;--dx:80px;--rot:400deg"></span>
        <span class="cf" style="left:41%;background:#C79A52;--dx:-45px;--rot:80deg"></span>
        <span class="cf" style="left:55%;background:#D9B678;--dx:35px;--rot:220deg;border-radius:50%"></span>
        <span class="cf" style="left:48%;background:#E3B49E;--dx:-10px;--rot:300deg"></span>
      </div>
    </div>
  </div>
  <div class="demo">
    <div class="pop show">
      <div class="pop-inner">
        <div class="pop-seal"><span>✧</span></div>
        <p class="pop-text">1차 관문 돌파!</p>
        <p class="pop-sub">하나만 해도 오늘은 이긴 거예요</p>
      </div>
      <div class="confetti"></div>
    </div>
  </div>
  <p class="hint">위: 루티 도장 쾅 / 아래: 1차 관문 돌파</p>
</body>
</html>
